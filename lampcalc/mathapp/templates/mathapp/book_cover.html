<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>The Seven Deaths</title>
<style>
  body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: 'Montserrat', 'Arial', sans-serif;
    background: #f6f6f6;
  }
  .cover {
    position: relative;
    width: 400px;
    height: 600px;
    /* Make sure your image file is in the same folder or adjust the path as needed */
    background: url("generated-image (3).png") ;
    margin: 40px auto;
    box-shadow: 0 10px 30px rgba(0,0,0,0.18);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }
  .overlay {
    position: absolute;
    width: 100%;
    height: 72%;
    top: 0;
    left: 0;
    background: rgba(255,255,255,0.83);
  }
  .main-title {
    position: absolute;
    top: 80px;
    width: 100%;
    text-align: center;
    font-size: 2.8rem;
    font-weight: bold;
    letter-spacing: 3px;
    color: #222;
    z-index: 2;
    line-height: 1.1;
  }
  .divider {
    margin: 20px auto 0 auto;
    border: 0;
    height: 2px;
    background: #222;
    width: 80px;
    z-index: 2;
  }
  .subtitle {
    position: absolute;
    top: 270px;
    width: 100%;
    text-align: center;
    font-size: 1.1rem;
    color: #333;
    z-index: 2;
    font-weight: normal;
    letter-spacing: 1px;
  }
  .footer {
    position: absolute;
    bottom: 20px;
    left: 0; right: 0;
    width: 100%;
    text-align: center;
    font-size: 1.1rem;
    font-weight: bold;
    color: #fff;
    background: #111;
    padding: 11px 0;
    letter-spacing: 2px;
    z-index: 3;
  }
</style>
</head>
<body>
  <div class="cover">
    <div class="overlay"></div>
    <div class="main-title">
      The Seven Deaths
    </div>
    <hr class="divider" />
    <div class="subtitle">
      By Jaisree
    </div>
    <div class="footer">
      complex murder mystery
    </div>
  </div>
</body>
</html>
